<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重彩 Inkbloom</title>
    <link rel="stylesheet" href="./src/shell/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view" tabindex="0"></canvas>
      <div id="hud"></div>
      <div id="overlay">
        <h1>重彩</h1>
        <p>世界本来是彩色的。墨潮抽走了颜色。</p>
        <button id="play">点击开始</button>
        <p class="keys">
          WASD 移动 · 空格 跳（可二段跳）· Shift 冲刺 · E 交互<br />
          左键按住 还色 · 右键 切换修复/涂鸦 · Q/R 或滚轮 换色<br />
          F2 自由飞行 · F3 调试面板 · Esc 暂停
        </p>
        <p id="overlay-error"></p>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
